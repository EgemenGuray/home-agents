[project]
name = "home-agents"
version = "0.1.0"
description = "Agent service, orchestrator and safety policy for the home system"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "anthropic>=1.17", "httpx>=0.27", "pynacl>=1.5", "cryptography>=43", "openpyxl>=3.1"]

[project.optional-dependencies]
service = ["fastapi>=0.115", "uvicorn>=0.30", "docker>=7", "nats-py>=2.9", "mcp>=1.10", "psycopg[binary]>=3.2"]
dev = ["pytest>=8", "fastapi>=0.115", "httpx2", "docker>=7", "psycopg[binary]>=3.2"]

[project.scripts]
home-agent = "home_agents.harness.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"home_agents.harness" = ["console/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
