# Each agent's NATS user may publish only to the policy ingress; the agent service (which
# checks the allow-list) is the only user that can deliver to job subjects (S1.5.2).
# Passwords come from the vault into nats.local.conf, which this file includes.
listen: 0.0.0.0:4222
max_payload: 1MB
include ./nats.local.conf
