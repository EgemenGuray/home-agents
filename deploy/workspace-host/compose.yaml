# Phase 1 workspace host: a rented Linux VM (16 to 32 GB) joined to the tailnet (S1.4.1).
# Workspaces live on an internal network with no internet. The egress gateway is the only
# container that can leave, and it forwards each route port to that route's proxy on the hub Mac
# over Tailscale, so a dropped route or tunnel fails closed (S1.3.4).
name: workspace-host

services:
  egress-gateway:
    image: alpine:3.20
    restart: unless-stopped
    networks: [ws-internal, uplink]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache socat >/dev/null
        socat TCP-LISTEN:18080,fork,reuseaddr TCP:$${HUB_TAILNET_HOST}:8888 &
        socat TCP-LISTEN:18081,fork,reuseaddr TCP:$${HUB_TAILNET_HOST}:8889 &
        socat TCP-LISTEN:18082,fork,reuseaddr TCP:$${HUB_TAILNET_HOST}:8890 &
        wait
    environment:
      HUB_TAILNET_HOST: ${HUB_TAILNET_HOST:?set in .env}

  screen-relay:
    # Live view and take over (S1.6.1): the app's only way into a desktop. Reads each desktop's VNC socket
    # from its own screen-<name> volume and accepts only tickets signed by the agent service. Published on
    # the tailnet with `tailscale serve --https=8710 8710`; nothing else can reach it.
    image: home-agents/service:${RELEASE:-latest}
    restart: unless-stopped
    command: ["python", "-m", "home_agents.screen_relay"]
    user: "0:0"                              # to open the sockets inside the Docker volumes folder
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: ["no-new-privileges"]
    environment:
      HOME_AGENTS_SCREEN_KEY: ${HOME_AGENTS_SCREEN_KEY:?set in .env, same value as the agent service}
      RELAY_HOST: 0.0.0.0
    volumes:
      - /var/lib/docker/volumes:/var/lib/docker/volumes:ro
    networks: [uplink]
    ports:
      - "127.0.0.1:8710:8710"

  langfuse:
    # Traces per request (S1.8.1); reachable only on the tailnet via tailscale serve on the VM.
    image: langfuse/langfuse:2
    restart: unless-stopped
    env_file: langfuse.env
    networks: [uplink]
    ports:
      - "127.0.0.1:3000:3000"

networks:
  ws-internal:
    name: ws-internal
    internal: true
  uplink:
